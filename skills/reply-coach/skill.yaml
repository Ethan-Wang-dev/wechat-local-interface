name: wechat-reply-coach
version: 0.1.0
description: 根据本地微信历史对话生成多风格、可编辑的回复建议，不自动发送
triggers:
  - 帮我想想这条微信怎么回
  - 根据聊天记录生成高情商回复
  - 给我几个正式、自然或幽默的回复版本
  - 帮我礼貌拒绝客户或同事
reads:
  - local_wechat_interface
writes: []
outputs:
  - media_type: text/markdown
    description: 回复候选、判断依据和发送前检查
  - media_type: application/json
    description: 结构化意图、候选、证据和风险
network: false
model: optional
