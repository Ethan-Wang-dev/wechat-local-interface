<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">微信本地数据接口架构</title>
  <desc id="desc">接入方调用语言无关的 JSON 协议，经过适配层访问只读标准化数据源，再读取已解密的 SQLite 快照。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1834"/><stop offset="1" stop-color="#16153a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0abfc"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8ea5d3"/></marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="#070f24"/>
  <rect x="22" y="22" width="1356" height="576" rx="22" fill="url(#surface)" stroke="#263863"/>
  <text x="70" y="76" fill="#f4f7ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" font-size="27" font-weight="700">一个数据源，多种接入方式</text>
  <text x="70" y="108" fill="#9db0d5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" font-size="16">协议让接入方无需了解 Python 和 SQLite 的内部实现。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif">
    <g transform="translate(70 172)">
      <rect width="230" height="290" rx="22" fill="#0d2140" stroke="#4778a9" stroke-width="1.5"/>
      <text x="26" y="42" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="1.5">接入方</text>
      <text x="26" y="82" fill="#f7fbff" font-size="21" font-weight="700">本地应用</text>
      <text x="26" y="119" fill="#d6e4ff" font-size="17">脚本与工具</text>
      <text x="26" y="151" fill="#d6e4ff" font-size="17">多语言服务</text>
      <text x="26" y="183" fill="#d6e4ff" font-size="17">桌面与自动化</text>
      <rect x="26" y="219" width="143" height="33" rx="16" fill="#67e8f9" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.5"/>
      <text x="97" y="241" text-anchor="middle" fill="#c8fbff" font-size="13" font-weight="650">JSON 输入 / 输出</text>
    </g>
    <g transform="translate(405 172)">
      <rect width="260" height="290" rx="22" fill="#171e4b" stroke="#8377cf" stroke-width="1.5"/>
      <text x="26" y="42" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.5">数据协议</text>
      <text x="26" y="84" fill="#fbfaff" font-size="21" font-weight="700">wechat.local</text>
      <text x="26" y="116" fill="#fbfaff" font-size="21" font-weight="700">protocol.v1</text>
      <text x="26" y="161" fill="#c9c8ee" font-size="16">稳定的操作名称</text>
      <text x="26" y="191" fill="#c9c8ee" font-size="16">请求 ID 与错误码</text>
      <text x="26" y="221" fill="#c9c8ee" font-size="16">JSON Schema 契约</text>
      <rect x="26" y="243" width="183" height="2" fill="url(#violet)"/>
    </g>
    <g transform="translate(770 172)">
      <rect width="260" height="290" rx="22" fill="#102e39" stroke="#48cfc4" stroke-width="1.5"/>
      <text x="26" y="42" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="1.5">标准化数据源</text>
      <text x="26" y="84" fill="#f5ffff" font-size="21" font-weight="700">WeChatSource</text>
      <text x="26" y="130" fill="#c8f4f2" font-size="16">联系人 · 群聊</text>
      <text x="26" y="160" fill="#c8f4f2" font-size="16">消息 · 收藏夹</text>
      <text x="26" y="190" fill="#c8f4f2" font-size="16">朋友圈 · 关系</text>
      <text x="26" y="236" fill="#c8f4f2" font-size="16">只读 · 快照安全</text>
      <rect x="26" y="258" width="184" height="2" fill="url(#cyan)"/>
    </g>
    <g transform="translate(1135 172)">
      <rect width="195" height="290" rx="22" fill="#331d3d" stroke="#d28bdc" stroke-width="1.5"/>
      <text x="26" y="42" fill="#f0abfc" font-size="13" font-weight="700" letter-spacing="1.5">本地快照</text>
      <text x="26" y="88" fill="#fff7ff" font-size="20" font-weight="700">SQLite</text>
      <text x="26" y="123" fill="#f2d9f2" font-size="15">contact.db</text>
      <text x="26" y="151" fill="#f2d9f2" font-size="15">message_*.db</text>
      <text x="26" y="179" fill="#f2d9f2" font-size="15">favorite.db</text>
      <text x="26" y="207" fill="#f2d9f2" font-size="15">sns.db</text>
      <text x="26" y="250" fill="#f2d9f2" font-size="15">已解密、隔离存放</text>
    </g>
  </g>
  <g fill="none" stroke="#8ea5d3" stroke-width="2" marker-end="url(#arrow)">
    <path d="M300 317H396"/>
    <path d="M665 317H761"/>
    <path d="M1030 317H1126"/>
  </g>
  <g opacity="0.35" filter="url(#soft)"><circle cx="695" cy="500" r="88" fill="#8b5cf6"/><circle cx="1080" cy="130" r="75" fill="#14b8a6"/></g>
  <text x="70" y="548" fill="#778bb5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',sans-serif" font-size="14">数据边界：不负责解密、不联网、不调用模型、不写入知识库。</text>
</svg>
