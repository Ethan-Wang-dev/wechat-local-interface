[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-local-interface"
version = "0.1.0"
description = "Read-only query and export interfaces for decrypted local Mac WeChat data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ethan Wang"}]
license = {file = "LICENSE"}
keywords = ["wechat", "wechat-database", "local-first", "data-interface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
zstandard = ["zstandard>=0.22,<1"]

[project.scripts]
wechat-local-interface = "wechat_local_interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
